name = "waynovo-ai-gateway"
main = "worker.js"
compatibility_date = "2026-11-17"

# Configure as chaves com "wrangler secret put"; nunca as grave neste arquivo.
[vars]
AI_PRIMARY_PROVIDER = "openai"
AI_PROVIDER_ORDER = "openai,gemini,groq,openrouter"
GEMINI_MODEL = "PREENCHA_COM_MODELO_GEMINI"
GROQ_MODEL = "PREENCHA_COM_MODELO_GROQ"
OPENROUTER_MODEL = "PREENCHA_COM_MODELO_OPENROUTER"
OPENAI_MODEL = "gpt-6-luna"
OPENROUTER_APP_NAME = "Waynovo"
CORS_ORIGINS = "*"
