name: Waynovo checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check bookmarklet.js
          node --check app.js
          node --check features.js
          node --check planner.js
          node --check service-worker.js
          node --check bypass-engine.js
          node --input-type=module --check < worker.js
      - name: Validate web manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Run test suite
        run: node --test tests/*.test.js
